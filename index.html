<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poster composer</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;900&family=Bricolage+Grotesque:wght@400;600;800&family=DM+Mono:wght@400&family=Newsreader:ital,wght@0,400;1,400&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EFE6;--ink:#111;--acc:#C2410C;--accink:#fff;--page:color-mix(in srgb,var(--acc) 28%,#fff);--stage:color-mix(in srgb,var(--acc) 60%,#fff)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--page);color:#111;font:400 16px/1.5 'Bricolage Grotesque',system-ui,sans-serif;transition:background .3s}
.wrap{max-width:1100px;margin:0 auto;padding:40px 24px;display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:48px;align-items:start}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:42px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
header p{margin:0;font:400 13px 'DM Mono',monospace}
section[aria-label=Controls]{background:#fff;border:3px solid #111;box-shadow:8px 8px 0 #111;border-radius:12px;padding:24px}
label,.lab{display:block;font:400 12px 'DM Mono',monospace;text-transform:uppercase;margin:16px 0 8px}
label{margin-top:0}
textarea,input{width:100%;font:inherit;font-size:18px;padding:12px;border:3px solid #111;border-radius:8px;background:#FFF1B8;color:#111}
textarea{height:110px;resize:vertical}
input{min-height:44px;font-size:16px}
.chips,.words{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;cursor:pointer;min-height:44px;padding:6px 14px;border:2.5px solid #111;border-radius:8px;background:#fff;color:#111}
.chips button[aria-pressed=true],.words button[aria-pressed=true]{background:#FF8FB8;box-shadow:3px 3px 0 #111}
.words button{min-height:36px;padding:2px 12px;font-size:14px}
.primary{width:100%;margin-top:24px;background:#111;color:#FFE066;border-width:3px}
#sh{width:100%;margin-top:10px;border-width:3px;box-shadow:4px 4px 0 #111}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1;border-width:3px;box-shadow:4px 4px 0 #111;padding:6px 4px}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #1D4ED8;outline-offset:2px}
#msg{min-height:24px;margin-top:12px;font:400 13px 'DM Mono',monospace}
.saved{display:flex;gap:8px;flex-wrap:wrap}.saved button{padding:0;min-height:0;border-radius:4px;overflow:hidden;width:64px;height:80px}.saved img{width:100%;height:100%;object-fit:cover;display:block}
.stage{display:flex;flex-direction:column;align-items:center;gap:28px;background:var(--stage);border:3px solid #111;border-radius:12px;padding:32px}
canvas{width:100%;max-width:520px;height:auto;border:3px solid #111;box-shadow:10px 10px 0 #111;transform:rotate(-1.5deg)}
.opts{display:flex;gap:12px;justify-content:center;width:100%}
.opts button{flex:0 1 150px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:3px 3px 0 #111}
.opts button[aria-pressed=true]{background:#FF8FB8}
.opts canvas{width:100%;max-width:none;height:auto;border:2px solid #111;display:block;transform:none;box-shadow:none}
.opts span{font:400 12px 'DM Mono',monospace;text-transform:uppercase}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<header><h1>Poster composer</h1><p>Type a line. Get a typographic poster.</p></header>
<section aria-label="Controls">
<label for="t">Your text</label>
<textarea id="t" maxlength="140">Start before you feel ready.</textarea>
<label for="a">Attribution (optional)</label>
<input id="a" maxlength="40" placeholder="Name or source">
<div class="lab" id="wl">Emphasized word (tap to change)</div>
<div class="words" id="words" role="group" aria-labelledby="wl"></div>
<div class="lab" id="tl">Tone</div>
<div class="chips" role="group" aria-labelledby="tl" id="tones"></div>
<div class="lab" id="xl">Texture</div>
<div class="chips" role="group" aria-labelledby="xl" id="tex"></div>
<div class="lab" id="zl">Size</div>
<div class="chips" role="group" aria-labelledby="zl" id="size"></div>
<button class="primary" id="ai">Suggest an idea</button><button id="sh" style="width:100%;margin-top:8px">Shuffle layout</button>
<div class="row"><button id="sv">Save</button><button id="dl">Download PNG</button><button id="cp">Copy link</button></div>
<div id="msg" role="status"></div>
<div class="lab" id="sl">Saved posters</div><div class="saved" id="saved" role="group" aria-labelledby="sl"></div><button id="cl" style="margin-top:8px;min-height:36px;font-size:14px">Clear saved</button>
</section>
<div class="stage"><canvas id="c" width="1080" height="1350" role="img" aria-label="Poster preview"></canvas><div class="opts" id="opts" role="group" aria-label="Poster styles"></div></div>
</main>
<script>
let H=1350;const SZ={sq:1080,r45:1350,st:1920,a4:1527},W=1080,M=96,cv=document.getElementById('c'),x=cv.getContext('2d'),T=document.getElementById('t'),msg=document.getElementById('msg');
const FN=new Set('a an the of to in on at by for and or but so if as is it be with from than that this then into over under my your our'.split(' '));
const KW={bold:'start go now make build never always fight win rise dare do stop begin keep move no first'.split(' '),calm:'breathe quiet slow peace gentle soft still rest silence calm home light rain wait listen'.split(' '),playful:'fun play dance laugh joy party wild silly magic maybe why surprise'.split(' ')};
const PAL={bold:[['#F4EFE6','#1B1B1B','#C2410C'],['#EDE6D6','#1B1B1B','#1D4ED8'],['#1B1B1B','#F4EFE6','#F97316']],
calm:[['#16352B','#F2EBDD','#E9C46A'],['#2B2438','#F3ECE4','#F2B5A0'],['#F2EBDD','#1F2A24','#8A3B2B']],
playful:[['#2D2A8C','#FFFFFF','#FFD23F','#1A1A1A'],['#0F766E','#FFFFFF','#FFE066','#1A1A1A'],['#B42318','#FFFFFF','#FFF1C2','#1A1A1A']]};
const CFG={
bold:{sf:s=>`400 ${s}px Archivo`,kf:s=>`900 ${s}px Archivo`,ss:76,km:340,sl:1.1,kl:.85,bar:1},
calm:{sf:s=>`400 ${s}px Newsreader`,kf:s=>`italic 400 ${s}px Newsreader`,ss:76,km:340,sl:1.15,kl:.95},
playful:{sf:s=>`700 ${s}px 'Space Grotesk'`,kf:s=>`700 ${s}px 'Space Grotesk'`,ss:120,km:280,sl:1.05,kl:.9,up:1,band:1}};
const st={t:T.value,tone:'auto',seed:0,ki:null,tex:'none',size:'r45',a:''},A=document.getElementById('a');
const clean=w=>w.toLowerCase().replace(/[^a-z0-9']/g,'');
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function detect(ws,t){const sc={bold:0,calm:0,playful:0};ws.forEach(w=>{const c=clean(w);for(const k in KW)if(KW[k].includes(c))sc[k]+=2});if(/!/.test(t)){sc.bold++;sc.playful++}if(/\?/.test(t))sc.playful++;const b=Object.entries(sc).sort((a,b)=>b[1]-a[1]);if(b[0][1]>0&&b[0][1]>b[1][1])return b[0][0];return ws.length<=5?'bold':'calm'}
function keyC(ws){return ws.map((w,i)=>{const c=clean(w);const s=FN.has(c)||!c?-1:c.length+(i==0?3:0)+(i==ws.length-1?3:0)+(KW.bold.includes(c)?5:0)+(w.length>1&&w===w.toUpperCase()&&/[A-Z]/.test(w)?4:0);return[i,s]}).filter(a=>a[1]>=0).sort((a,b)=>b[1]-a[1]).map(a=>a[0])}
function brk(w,n){const L=w.map(s=>s.length+1),N=w.length;n=Math.max(1,Math.min(n,N));const id=L.reduce((a,b)=>a+b,0)/n;
const cost=(i,j)=>{let l=0;for(let k=i;k<j;k++)l+=L[k];let c=(l-id)**2;if(j<N&&FN.has(clean(w[j-1])))c+=900;return c};
const D=Array.from({length:n+1},()=>Array(N+1).fill(1e9)),P=D.map(r=>r.map(()=>0));D[0][0]=0;
for(let k=1;k<=n;k++)for(let j=k;j<=N;j++)for(let i=k-1;i<j;i++){const c=D[k-1][i]+cost(i,j);if(c<D[k][j]){D[k][j]=c;P[k][j]=i}}
const out=[];let j=N;for(let k=n;k>0;k--){const i=P[k][j];out.unshift(w.slice(i,j));j=i}return out}
function plan(tone){const ws=st.t.trim().split(/\s+/).filter(Boolean);if(!ws.length)return null;
const r=rng(st.seed*7919+ws.length),c=keyC(ws);
const ki=st.ki!=null&&st.ki<ws.length?st.ki:c.length?c[st.seed?Math.floor(r()*Math.min(2,c.length)):0]:0;st.lk=ki;
const base=Math.max(1,Math.min(4,Math.round(ws.length/2.6)));
const n=Math.max(1,Math.min(ws.length,base+(st.seed?Math.floor(r()*3)-1:0)));
let q=0;const segs=[];
for(const ln of brk(ws,n)){const s0=q;q+=ln.length;
if(ki>=s0&&ki<q){const a=ln.slice(0,ki-s0).join(' '),b=ln.slice(ki-s0+1).join(' ');if(a)segs.push({t:a});segs.push({t:ws[ki],key:1});if(b)segs.push({t:b})}
else segs.push({t:ln.join(' ')})}
if(CFG[tone].band){const f=segs.find(s=>!s.key);if(f)f.band=1}
return segs}
function fit(t,f,max,min,w){let s=max;while(s>min){x.font=f(s);if(x.measureText(t).width<=w)break;s-=4}return s}
function lum(h){const v=[1,3,5].map(i=>{const c=parseInt(h.substr(i,2),16)/255;return c<=.03928?c/12.92:((c+.055)/1.055)**2.4});return .2126*v[0]+.7152*v[1]+.0722*v[2]}
function theme(p){const r=document.documentElement.style;r.setProperty('--bg',p[0]);r.setProperty('--ink',p[1]);r.setProperty('--acc',p[2]);r.setProperty('--accink',lum(p[2])>.4?'#1B1B1B':'#fff')}
function draw(ov){
H=SZ[st.size];cv.height=H;cv.style.maxWidth=Math.min(520,innerHeight*.85*W/H)+'px';
const ws=st.t.trim().split(/\s+/).filter(Boolean);
const tone=ov||(st.tone==='auto'?detect(ws,st.t):st.tone),C=CFG[tone],p=PAL[tone][st.seed%3],segs=plan(tone);
x.clearRect(0,0,W,H);x.fillStyle=p[0];x.fillRect(0,0,W,H);if(!ov){theme(p);st.et=tone}tex(p);
cv.setAttribute('aria-label','Poster: '+st.t);
if(!segs)return;
const w=W-2*M,gap=20,at=st.a.trim(),rs=at?72:0;let sc=1,items,total;
const lay=()=>items=segs.map(s=>{const f=s.key?C.kf:C.sf,t=s.key&&C.up?s.t.toUpperCase():s.t,sz=fit(t,f,(s.key?C.km:C.ss)*sc,28,w-(s.band?72:0));return{...s,t,f,sz,h:sz*(s.key?C.kl:C.sl)*(s.band?1.25:1)}});
const tot=()=>items.reduce((a,b)=>a+b.h,0)+gap*(items.length-1)+(C.bar?72:0);
lay();total=tot();while(total>H-2*M-rs&&sc>.3){sc*=.92;lay();total=tot()}
let y=H-M-rs-total;
if(C.bar){x.fillStyle=p[2];x.fillRect(M,y,124,16);y+=72}
x.textBaseline='alphabetic';
for(const it of items){x.font=it.f(it.sz);
let col=it.key?(tone==='playful'?p[1]:p[2]):p[1];
if(it.band){const bw=x.measureText(it.t).width+72;x.fillStyle=p[2];x.fillRect(M,y,bw,it.h);col=p[3];x.fillStyle=col;x.fillText(it.t,M+36,y+it.h*.5+it.sz*.3)}
else{x.fillStyle=col;x.fillText(it.t,M,y+it.sz*.8)}
y+=it.h+gap}
if(at){x.font="400 38px 'DM Mono'";x.fillStyle=p[1];x.globalAlpha=.75;x.fillText('— '+at,M,H-M);x.globalAlpha=1}
}
const tones=[['auto','Auto'],['bold','Bold'],['calm','Calm'],['playful','Playful']],tb=document.getElementById('tones');
const grp=[[tb,tones,'tone'],[document.getElementById('tex'),[['none','None'],['grain','Grain'],['dots','Dots'],['glow','Glow']],'tex'],[document.getElementById('size'),[['sq','Square'],['r45','4:5'],['st','Story'],['a4','A4']],'size']];
grp.forEach(([el,o,k])=>o.forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;b.dataset.v=v;b.onclick=()=>{st[k]=v;sync()};el.append(b)}));
function enc(){return btoa(unescape(encodeURIComponent(JSON.stringify({t:st.t,k:st.tone,s:st.seed,i:st.ki,x:st.tex,z:st.size,a:st.a}))))}
function sync(){grp.forEach(([el,o,k])=>[...el.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===st[k])));all();words();try{history.replaceState(null,'','#'+enc())}catch(e){}}
try{const o=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));if(o.t){st.t=o.t;T.value=o.t}if(o.k)st.tone=o.k;if(o.s)st.seed=o.s;if(o.i!=null)st.ki=o.i;if(o.x)st.tex=o.x;if(SZ[o.z])st.size=o.z;if(o.a){st.a=o.a;A.value=o.a}}catch(e){}
T.oninput=()=>{st.t=T.value;st.ki=null;sync()};A.oninput=()=>{st.a=A.value;sync()};
document.getElementById('sh').onclick=()=>{st.seed++;sync()};
document.getElementById('dl').onclick=()=>cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='poster.png';a.click();msg.textContent='Poster downloaded.'});
document.getElementById('cp').onclick=()=>{const u=location.href.split('#')[0]+'#'+enc();navigator.clipboard.writeText(u).then(()=>msg.textContent='Link copied.').catch(()=>prompt('Copy this link',u))};
function tex(p){const t=st.tex;if(t==='none')return;const q=rng(99);x.fillStyle=p[1];
if(t==='grain'){x.globalAlpha=.07;for(let i=0;i<9000;i++)x.fillRect(q()*W,q()*H,2,2)}
else if(t==='dots'){x.globalAlpha=.09;for(let i=48;i<W;i+=48)for(let j=48;j<H;j+=48){x.beginPath();x.arc(i,j,3,0,7);x.fill()}}
else if(t==='glow'){const g=x.createRadialGradient(W*.85,H*.12,0,W*.85,H*.12,W*.9);g.addColorStop(0,p[2]);g.addColorStop(1,p[0]);x.globalAlpha=.4;x.fillStyle=g;x.fillRect(0,0,W,H)}
x.globalAlpha=1}
function words(){const wb=document.getElementById('words'),ws=st.t.trim().split(/\s+/).filter(Boolean),k=ws.join(' ');if(wb.dataset.t!==k){wb.dataset.t=k;wb.textContent='';ws.forEach((w,i)=>{const b=document.createElement('button');b.type='button';b.textContent=w;b.onclick=()=>{st.ki=i;sync()};wb.append(b)})}[...wb.children].forEach((b,i)=>b.setAttribute('aria-pressed',i===st.lk))}
const SV=document.getElementById('saved');
function load(){try{return JSON.parse(localStorage.getItem('pc_saved')||'[]')}catch(e){return[]}}
function renderSaved(){const l=load();SV.textContent='';l.forEach(o=>{const b=document.createElement('button');b.setAttribute('aria-label','Open saved poster: '+o.s.t);const im=new Image();im.src=o.th;im.alt='';b.append(im);b.onclick=()=>{Object.assign(st,o.s);T.value=st.t;A.value=st.a;sync()};SV.append(b)});if(!l.length)SV.textContent='None yet.'}
document.getElementById('sv').onclick=()=>{const t=document.createElement('canvas');t.width=128;t.height=Math.round(128*H/W);t.getContext('2d').drawImage(cv,0,0,t.width,t.height);const l=load();l.unshift({s:{...st},th:t.toDataURL('image/jpeg',.7)});try{localStorage.setItem('pc_saved',JSON.stringify(l.slice(0,8)));msg.textContent='Saved. The last 8 posters are kept in this browser.'}catch(e){msg.textContent='Could not save in this browser.'}renderSaved()};
document.getElementById('cl').onclick=()=>{try{localStorage.removeItem('pc_saved')}catch(e){}renderSaved()};
document.getElementById('ai').onclick=async()=>{msg.textContent='Thinking of an idea…';try{const r=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:st.t})});if(!r.ok)throw 0;const d=await r.json();if(d.tone)st.tone=d.tone;if(d.key!=null)st.ki=d.key;sync();msg.textContent='Here is a suggestion: a tone and an emphasized word. You can still change them.'}catch(e){msg.textContent='Suggestions are not available right now, so the built-in rules are in use.'}};
const th={},ob=document.getElementById('opts');
[['bold','Bold'],['calm','Calm'],['playful','Playful']].forEach(([t,l])=>{const b=document.createElement('button'),c=document.createElement('canvas'),sp=document.createElement('span');b.type='button';b.dataset.t=t;b.setAttribute('aria-label','Use the '+l+' style');c.width=216;c.setAttribute('aria-hidden','true');sp.textContent=l;b.append(c,sp);b.onclick=()=>{st.tone=t;sync()};ob.append(b);th[t]=c});
function all(){['bold','calm','playful'].forEach(t=>{draw(t);const c=th[t];c.height=Math.round(216*H/W);c.getContext('2d').drawImage(cv,0,0,216,c.height)});draw();[...ob.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===st.et))}
renderSaved();sync();
Promise.all(["900 100px Archivo","400 100px Archivo","400 100px Newsreader","italic 400 100px Newsreader","700 100px 'Space Grotesk'","400 100px 'DM Mono'"].map(f=>document.fonts.load(f))).then(all);
</script>
</body>
</html>
